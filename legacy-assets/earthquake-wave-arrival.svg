<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">P波とS波の到着時刻</title><desc id="desc">地震計の記録でP波が先に到着し、P波とS波の到着時刻の差が初期微動継続時間になることを示す模式図。</desc>
<rect width="1200" height="680" rx="28" fill="#f7fafc"/><text x="60" y="72" font-family="sans-serif" font-size="34" font-weight="700" fill="#172b4d">地震計の記録と初期微動継続時間</text><text x="60" y="115" font-family="sans-serif" font-size="19" fill="#52657d">P波は速く伝わり小さなゆれ、S波は遅れて大きなゆれを起こす</text>
<rect x="70" y="160" width="1060" height="360" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
<path d="M130 330 H1080" stroke="#64748b" stroke-width="3"/><path d="M130 220 V450" stroke="#cbd5e1" stroke-width="2"/><path d="M130 330 L210 330 L230 320 L245 342 L260 315 L275 345 L290 330 L420 330 L440 300 L460 365 L480 275 L500 390 L520 245 L540 410 L560 260 L580 395 L600 280 L620 375 L640 290 L660 360 L680 310 L700 350 L720 330" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
<path d="M130 330 H420" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M290 230 V465" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7"/><path d="M440 230 V465" stroke="#d97706" stroke-width="3" stroke-dasharray="8 7"/>
<text x="245" y="205" font-family="sans-serif" font-size="22" font-weight="700" fill="#2563eb">P波到着</text><text x="415" y="205" font-family="sans-serif" font-size="22" font-weight="700" fill="#b45309">S波到着</text>
<path d="M290 475 V495 M440 475 V495 M290 485 H440" stroke="#0f766e" stroke-width="4"/><text x="310" y="550" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f766e">初期微動継続時間</text>
<text x="110" y="600" font-family="sans-serif" font-size="17" fill="#475569">記録開始</text><text x="1010" y="600" font-family="sans-serif" font-size="17" fill="#475569">時間の経過 →</text>
<rect x="720" y="185" width="360" height="115" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="750" y="225" font-family="sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">計算のポイント</text><text x="750" y="260" font-family="sans-serif" font-size="17" fill="#334155">S波の到着時刻 − P波の到着時刻</text><text x="750" y="285" font-family="sans-serif" font-size="16" fill="#475569">震源距離が遠いほど長くなる</text>
</svg>
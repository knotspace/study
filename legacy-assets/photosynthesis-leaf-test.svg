<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">光合成に必要な条件を調べる実験</title><desc id="desc">ふ入りの葉とアルミニウムはくを使い、光と葉緑体の有無を比べる実験の模式図。</desc>
<rect width="1200" height="680" rx="28" fill="#f7fafc"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#172b4d">光合成に必要な条件を調べる</text><text x="60" y="112" font-family="sans-serif" font-size="19" fill="#52657d">ふ入りの葉を使い「光」と「葉緑体」の必要性を確かめる</text>
<rect x="55" y="150" width="520" height="430" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="625" y="150" width="520" height="430" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
<text x="90" y="200" font-family="sans-serif" font-size="25" font-weight="700" fill="#1f5c45">① 実験前の準備</text>
<path d="M300 470 C275 385 280 310 330 250" fill="none" stroke="#397d55" stroke-width="13" stroke-linecap="round"/><path d="M325 350 C225 285 150 330 185 395 C225 445 285 400 325 350Z" fill="#8fca75" stroke="#397d55" stroke-width="5"/><path d="M325 350 L192 393" stroke="#397d55" stroke-width="4"/><path d="M330 310 C385 235 485 250 480 325 C470 385 390 390 330 310Z" fill="#d9edb8" stroke="#397d55" stroke-width="5"/><path d="M330 310 L470 270" stroke="#397d55" stroke-width="4"/>
<rect x="300" y="288" width="70" height="115" rx="5" fill="#aeb8c4" opacity=".9"/><path d="M300 288 L370 288 L370 403 L300 403Z" fill="#64748b" opacity=".35"/><text x="90" y="520" font-family="sans-serif" font-size="18" fill="#334155">葉の一部をアルミニウムはくでおおう</text><path d="M370 340 L450 445" stroke="#64748b" stroke-width="3"/><text x="390" y="470" font-family="sans-serif" font-size="16" fill="#475569">はくで遮光</text>
<text x="660" y="200" font-family="sans-serif" font-size="25" font-weight="700" fill="#1f5c45">② ヨウ素液で確認</text>
<path d="M790 330 C730 270 680 330 715 390 C750 440 810 400 790 330Z" fill="#8fca75" stroke="#397d55" stroke-width="5"/><path d="M790 330 L730 390" stroke="#397d55" stroke-width="4"/><path d="M930 330 C870 270 820 330 855 390 C890 440 950 400 930 330Z" fill="#5141a5" stroke="#342a83" stroke-width="5"/><path d="M930 330 L870 390" stroke="#342a83" stroke-width="4"/><path d="M990 330 C930 270 880 330 915 390 C950 440 1010 400 990 330Z" fill="#e5e7eb" stroke="#64748b" stroke-width="5"/><path d="M990 330 L930 390" stroke="#64748b" stroke-width="4"/>
<text x="675" y="475" font-family="sans-serif" font-size="18" fill="#334155">青紫色：デンプンあり</text><text x="675" y="510" font-family="sans-serif" font-size="18" fill="#334155">色が変わらない：デンプンなし</text>
<rect x="665" y="535" width="440" height="28" rx="8" fill="#e8f3e8"/><text x="685" y="555" font-family="sans-serif" font-size="15" font-weight="700" fill="#1f5c45">光が当たり、葉緑体がある部分でデンプンができる</text>
</svg>